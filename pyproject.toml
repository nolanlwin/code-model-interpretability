[project]
name = "code-model-interpretability"
version = "0.1.0"
description = "Interpretability experiments on coding LLMs (variable roles across XLCoST languages)."
requires-python = ">=3.11"
dependencies = [
    "accelerate>=0.26.0",
    "datasets>=2.18.0",
    "matplotlib>=3.8.0",
    "matplotlib-inline>=0.1.6",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "torch>=2.1.0",
    "tqdm>=4.66.0",
    "transformers>=4.40.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-php>=0.24.1",
    "tree-sitter-ruby>=0.23.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
