name: forall
version: 1
description: Forall spec-driven development with formal verification
artifacts:
  - id: proposal
    generates: proposal.md
    description: Why this change is needed
    template: proposal.md
    instruction: |
      Create the proposal that establishes WHY this change is needed.

      Sections:
      - **Why**: Problem or opportunity (1-2 sentences)
      - **What Changes**: Bullet list of changes; mark **BREAKING** where applicable
      - **Capabilities**: New and modified capabilities (kebab-case). Each becomes specs/<capability>/spec.md
      - **Impact**: Affected code, APIs, dependencies

      List which capabilities need formal verification (`verified: true` in verification phase).
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Requirements and scenarios (delta specs)
    template: spec.md
    instruction: |
      Create one spec file per capability from the proposal under specs/<capability>/spec.md.

      Use delta sections: ## ADDED / MODIFIED / REMOVED / RENAMED Requirements
      Each requirement: ### Requirement: <name> with SHALL/MUST prose
      Each scenario: #### Scenario: <name> with WHEN/THEN bullets (exactly 4 hashtags)

      Every requirement MUST have at least one scenario.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design before implementation
    template: design.md
    instruction: |
      Explain HOW to implement the change.

      Sections: Context, Goals / Non-Goals, Decisions, Risks / Trade-offs,
      Migration Plan, Open Questions.

      Reference specs for requirements; keep code-level detail out of specs.
    requires:
      - proposal

  - id: verification
    generates: verification.md
    description: Verification plan and mapping delta
    template: verification.md
    instruction: |
      For each requirement marked for formal verification:
      - Assign requirement id (kebab-case)
      - Name TS file + symbols
      - Draft //@ contract from requirement prose
      - Sketch //@ ensures plan and .dfy files

      Update mapping.delta.yaml for this change (requirement → code links).
    requires:
      - specs
      - design

  - id: tasks
    generates: tasks.md
    description: Implementation checklist
    template: tasks.md
    instruction: |
      Break down implementation as checkbox tasks: `- [ ] X.Y Description`

      Include: implement code, add //@ annotations, update proofs, run `forall check`.
      Group under ## numbered headings.
    requires:
      - specs
      - design
      - verification

apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Read context files for this change. Complete pending tasks; mark `- [x]` when done.
    After TS edits run `forall sync --change <name>` if available.
    Before finishing run `forall check --change <name>`.
