version: 1
requirements:
  - id: notebooks-name-the-repository-directly
    capability: repository-references
    requirement: "Notebooks name the repository directly"
    verified: false
    code:
      file: notebooks/colab_export_results.ipynb
      symbols: [notebook]
    contract: |
      Every hard-coded clone, push, and browse URL names
      github.com/nolanlwin/code-model-interpretability, so no notebook depends
      on a GitHub rename redirect. This notebook is the anchor because it both
      clones and pushes.
    claimcheck: false

  - id: artifact-root-follows-the-renamed-drive-folder
    capability: repository-references
    requirement: "Artifact root follows the renamed Drive folder"
    verified: false
    code:
      file: notebooks/colab_export_results.ipynb
      symbols: [notebook]
    contract: |
      The Drive artifact root names the folder as it now exists in Drive, from
      both the Colab mount and macOS Drive sync. No retired artifact-root name
      survives in a notebook or script.
    claimcheck: false

  - id: browse-links-name-the-current-repository
    capability: repository-references
    requirement: "Browse links name the current repository"
    verified: false
    code:
      file: README.md
      symbols: [document]
    contract: |
      The Colab badge uses the colab.research.google.com/github/<owner>/<repo>
      form, which hides the repository name from a search for the github.com
      host, and names the current repository.
    claimcheck: false

  - id: project-identifiers-use-the-current-name
    capability: repository-references
    requirement: "Project identifiers use the current name"
    verified: false
    code:
      file: pyproject.toml
      symbols: [project]
    contract: |
      The Python project name, the matching uv.lock entry, and every Drive
      checkout candidate use code-model-interpretability. No retired repository
      name remains outside historical workflow documents.
    claimcheck: false

  - id: edited-notebooks-remain-loadable
    capability: repository-references
    requirement: "Edited notebooks remain loadable"
    verified: false
    code:
      file: notebooks/colab_export_results.ipynb
      symbols: [notebook]
    contract: |
      Each edited notebook parses as JSON after substitution and retains its
      original cell count.
    claimcheck: false
